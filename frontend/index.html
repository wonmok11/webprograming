<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중고 장터</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="header-placeholder"></header>

<main class="container">
    <section id="view-home" class="page-section active-section">
        <h2 class="section-title">카테고리</h2>
        <div class="category-list">
            <button class="category-btn active">전체</button>
            <button class="category-btn">전공책</button>
            <button class="category-btn">비품</button>
            <button class="category-btn">전자기기</button>
            <button class="category-btn">의류</button>
            <button class="category-btn">기타</button>
        </div>
        <h2 class="section-title">전체 상품</h2>
        <div class="product-grid" id="product-list-container"></div>
    </section>

    <section id="view-create" class="page-section">
        <div class="form-wrapper">
            <h2 class="section-title" style="text-align: center;">상품 등록하기</h2>
            <form id="create-form" onsubmit="handleCreate(event)">
                <div class="form-group"><label>상품명</label><input type="text" id="p-title" class="form-control" required></div>
                <div class="form-group"><label>카테고리</label><select id="p-category" class="form-control"><option>전공책</option><option>전자기기</option><option>의류</option></select></div>
                <div class="form-group"><label>가격 (원)</label><input type="number" id="p-price" class="form-control" required></div>

                <div class="form-group"><label>상품 이미지</label><input type="file" id="p-image" class="form-control" accept="image/*"></div>

                <div class="form-group"><label>설명</label><textarea id="p-desc" class="form-control" rows="4" required></textarea></div>
                <button type="submit" class="btn btn-black" style="width: 100%;">등록 완료</button>
            </form>
        </div>
    </section>

    <section id="view-login" class="page-section">
        <div class="form-wrapper">
            <h2 class="section-title" style="text-align: center;">로그인</h2>
            <form id="login-form">
                <div class="form-group"><label>이메일</label><input type="email" id="l-email" class="form-control" required></div>
                <div class="form-group"><label>비밀번호</label><input type="password" id="l-password" class="form-control" required></div>

                <button type="button" class="btn btn-black" style="width: 100%; margin-top: 10px;" onclick="handleLogin(event)">로그인</button>

                <div style="text-align: center; margin-top: 15px; font-size: 14px;">
                    계정이 없으신가요? <span onclick="switchView('view-signup')" style="color: #007bff; cursor: pointer; text-decoration: underline;">회원가입하기</span>
                </div>
            </form>
        </div>
    </section>

    <section id="view-signup" class="page-section">
        <div class="form-wrapper">
            <h2 class="section-title" style="text-align: center;">회원가입</h2>
            <form id="signup-form">
                <div class="form-group"><label>이메일</label><input type="email" id="s-email" class="form-control" required></div>
                <div class="form-group"><label>비밀번호</label><input type="password" id="s-password" class="form-control" required></div>
                <div class="form-group"><label>닉네임</label><input type="text" id="s-nickname" class="form-control" placeholder="사용할 닉네임을 입력하세요" required></div>

                <button type="button" class="btn btn-black" style="width: 100%; margin-top: 10px;" onclick="handleSignup(event)">회원가입 완료</button>

                <div style="text-align: center; margin-top: 15px; font-size: 14px;">
                    이미 계정이 있으신가요? <span onclick="switchView('view-login')" style="color: #007bff; cursor: pointer; text-decoration: underline;">로그인하기</span>
                </div>
            </form>
        </div>
    </section>
</main>

<footer id="footer-placeholder"></footer>

<script src="/js/sub.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
